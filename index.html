<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petualangan Atman – PA Hindu dan Budi Pekerti XII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#17123a; --night2:#2d1b55; --dusk:#7a2e4d; --gold:#f0b94a; --gold2:#ffd98a; --saffron:#ef7b2c;
  --parch:#fcf4e2; --parch2:#f3e5c6; --ink:#2b2140; --ink2:#5b4d73; --ok:#1f8a5b; --okbg:#dff5e9; --bad:#c23b3b; --badbg:#fde4e2; --line:#d9c79e;
  --font-head:'Cinzel','Georgia',serif; --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-body);color:var(--ink);min-height:100vh;
  background:
   radial-gradient(1.5px 1.5px at 12% 18%,#fff9 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 28% 8%,#fff8 50%,transparent 51%),
   radial-gradient(2px 2px at 47% 22%,#fffa 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 63% 11%,#fff8 50%,transparent 51%),
   radial-gradient(2px 2px at 78% 26%,#fff9 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 91% 9%,#fff8 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 5% 42%,#fff7 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 38% 40%,#fff7 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 85% 44%,#fff7 50%,transparent 51%),
   linear-gradient(180deg,var(--night) 0%,var(--night2) 55%,var(--dusk) 100%);
  background-attachment:fixed;}
#app{max-width:1000px;margin:0 auto;padding:16px 16px 90px}
h1,h2,h3{font-family:var(--font-head);margin:0}
button{font-family:inherit;cursor:pointer}
.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between;color:#fff;padding:6px 2px 14px;flex-wrap:wrap}
.brand{font-family:var(--font-head);font-weight:800;letter-spacing:.04em;color:var(--gold2);font-size:1.05rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#ffffff1a;border:1px solid #ffffff30;color:#fff;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700}
.chip b{color:var(--gold2)}
.card{background:var(--parch);border-radius:18px;padding:22px;box-shadow:0 10px 30px #0006,inset 0 0 0 2px var(--parch2);position:relative}
.card.narrow{max-width:640px;margin:0 auto}
.card h2{font-size:1.45rem;color:var(--night2);margin-bottom:6px}
.sub{color:var(--ink2);margin:0 0 16px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-size:1rem;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#3b2506;box-shadow:0 4px 0 #b8861f,0 8px 16px #0004;transition:transform .1s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #b8861f}
.btn:disabled{background:#cfc6b0;color:#8b8370;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--night2);box-shadow:inset 0 0 0 2px var(--night2)}
.btn.small{padding:7px 12px;font-size:.85rem;border-radius:9px}
.btn.green{background:linear-gradient(180deg,#4cc58b,#1f8a5b);color:#fff;box-shadow:0 4px 0 #14603e,0 8px 16px #0004}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
/* splash */
.splash{text-align:center;color:#fff;padding:30px 8px 10px}
.splash .om{font-size:1.1rem;color:var(--gold2);letter-spacing:.1em}
.splash h1{font-size:clamp(1.9rem,6vw,3.2rem);color:var(--gold2);text-shadow:0 3px 0 #0006;margin:10px 0 6px;line-height:1.15}
.splash p{max-width:560px;margin:0 auto 20px;color:#f3e9ff;font-size:1.05rem}
.gate{width:min(380px,80%);margin:10px auto 0;display:block;filter:drop-shadow(0 8px 20px #0008)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;max-width:760px;margin:22px auto 0;text-align:left}
.rule{background:#ffffff14;border:1px solid #ffffff22;border-radius:12px;padding:10px 12px;font-size:.88rem;color:#efe6ff}
.rule b{display:block;color:var(--gold2);margin-bottom:2px}
/* map */
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:6px;position:relative}
.node{background:var(--parch);border-radius:16px;padding:14px 12px 16px;text-align:center;position:relative;border:0;color:var(--ink);box-shadow:0 8px 20px #0005;min-height:190px;display:flex;flex-direction:column;align-items:center;gap:6px}
.node .ic{font-size:2.3rem;line-height:1}
.node .no{font-family:var(--font-head);font-size:.78rem;color:var(--ink2);letter-spacing:.08em}
.node .nm{font-weight:800;font-size:.98rem;line-height:1.2}
.node .ds{font-size:.8rem;color:var(--ink2);flex:1}
.node .st{font-size:.8rem;font-weight:800;border-radius:999px;padding:4px 10px}
.node.locked{filter:grayscale(.85) brightness(.82);cursor:not-allowed}
.node.locked .st{background:#ccc;color:#555}
.node.open{outline:3px solid var(--gold);animation:glow 1.8s ease-in-out infinite;cursor:pointer}
.node.open .st{background:var(--saffron);color:#fff}
.node.done{cursor:pointer}
.node.done .st{background:var(--okbg);color:var(--ok)}
.node.open::before{content:"🧘";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:1.6rem;animation:bob 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px #f0b94a55,0 8px 20px #0005}}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
@media(max-width:820px){.map{grid-template-columns:1fr}.node{min-height:0;flex-direction:row;text-align:left;gap:12px;padding:12px 14px}.node .ic{font-size:2rem}.node .tx{flex:1}.node.open::before{top:-16px;left:30px;transform:none;animation:none}}
.node .tx{display:flex;flex-direction:column;gap:3px;align-items:center}
@media(max-width:820px){.node .tx{align-items:flex-start}}
.xpbar{height:12px;background:#ffffff22;border-radius:99px;overflow:hidden;margin:4px 0 14px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--saffron),var(--gold2));border-radius:99px;transition:width .6s}
/* forms */
label{display:block;font-weight:800;margin:14px 0 5px}
input[type=text],input[type=number],select,textarea{width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:#fffdf7;font:inherit;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid #f0b94a88;border-color:var(--gold)}
.hint{font-size:.82rem;color:var(--ink2);margin-top:4px}
.err{color:var(--bad);font-weight:700;font-size:.9rem;margin-top:8px;min-height:1.2em}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:16px}
.check input{margin-top:4px;width:18px;height:18px}
/* materi */
.layout{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.side{background:#ffffff14;border:1px solid #ffffff25;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px}
@media(max-width:820px){.side{flex-direction:row;overflow-x:auto}.side .pos{min-width:150px}}
.pos{border:0;text-align:left;border-radius:10px;padding:9px 10px;background:#ffffff18;color:#fff;font-weight:700;font-size:.88rem;display:flex;gap:8px;align-items:center}
.pos.cur{background:var(--gold);color:#3b2506}
.pos.done{background:#1f8a5b66}
.pos:disabled{opacity:.5;cursor:not-allowed}
.mat h2{font-size:1.5rem}
.mat h3{font-size:1.05rem;color:var(--saffron);margin:18px 0 6px;font-family:var(--font-body);font-weight:800}
.mat p,.mat li{line-height:1.65}
.mat ul{padding-left:20px}
.box{background:#fff;border-left:5px solid var(--gold);border-radius:10px;padding:12px 14px;margin:14px 0}
.box.sloka{border-color:var(--saffron);background:#fff7ea;font-style:italic}
.box.warn{border-color:var(--bad);background:#fff3f1}
.tbl{width:100%;border-collapse:collapse;margin:12px 0;font-size:.92rem;background:#fff;border-radius:10px;overflow:hidden}
.tbl th{background:var(--night2);color:#fff;text-align:left;padding:9px 10px}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--parch2);vertical-align:top}
.tblwrap{overflow-x:auto}
.readbar{position:sticky;bottom:0;margin:20px -22px -22px;background:var(--parch2);padding:12px 22px;border-radius:0 0 18px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:2px solid var(--line)}
.readbar .msg{font-weight:700;font-size:.9rem;color:var(--ink2)}
/* penerapan */
.scn{background:#fff;border-radius:14px;padding:14px 16px;margin:12px 0;border:2px solid var(--parch2)}
.scn .tag{display:inline-block;background:var(--night2);color:#fff;border-radius:99px;padding:3px 11px;font-size:.78rem;font-weight:800;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:#fffdf7;border-radius:12px;padding:11px 13px;margin:8px 0;font:inherit;color:var(--ink);font-weight:600;line-height:1.45;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--gold);background:#fff8e6}
.opt .ltr{flex:0 0 28px;height:28px;border-radius:50%;background:var(--parch2);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.opt.sel{border-color:var(--saffron);background:#fff1dd}
.opt.sel .ltr{background:var(--saffron);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .ltr{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .ltr{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:10px;border-radius:12px;padding:12px 14px;font-weight:600;line-height:1.55}
.fb.ok{background:var(--okbg);color:#124d33}
.fb.no{background:var(--badbg);color:#7a1f1f}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.qno{font-family:var(--font-head);font-weight:800;color:var(--night2);font-size:1.1rem}
.badge{display:inline-block;background:var(--saffron);color:#fff;font-weight:800;font-size:.75rem;border-radius:99px;padding:3px 10px;margin-left:6px;vertical-align:middle}
.ring{position:relative;width:64px;height:64px}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:.95rem}
.prog{display:flex;gap:4px;margin-bottom:14px}
.prog i{flex:1;height:7px;border-radius:9px;background:var(--parch2)}
.prog i.on{background:var(--gold)}
.prog i.ok{background:var(--ok)}
.prog i.no{background:var(--bad)}
.wac{background:#fff;border-radius:12px;padding:14px 16px;line-height:1.65;margin-bottom:12px;border:1px solid var(--parch2)}
.q{font-weight:800;margin:12px 0 4px;line-height:1.55}
figure{margin:12px 0;text-align:center}
figure img{max-width:100%;max-height:260px;border-radius:12px;border:2px solid var(--parch2)}
figcaption{font-size:.82rem;color:var(--ink2);margin-top:4px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.nav button{width:34px;height:34px;border-radius:9px;border:2px solid var(--line);background:#fffdf7;font-weight:800;color:var(--ink)}
.nav button.ans{background:var(--gold2);border-color:var(--gold)}
.nav button.cur{outline:3px solid var(--night2)}
/* hasil */
.bigscore{font-family:var(--font-head);font-size:clamp(3rem,12vw,5rem);color:var(--night2);line-height:1}
.stars{font-size:2rem;letter-spacing:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:#fff;border-radius:12px;padding:12px;text-align:center;border:1px solid var(--parch2)}
.stat b{display:block;font-size:1.5rem;color:var(--night2)}
.stat span{font-size:.8rem;color:var(--ink2)}
details{background:#fff;border-radius:10px;margin:8px 0;padding:10px 14px;border:1px solid var(--parch2)}
details summary{cursor:pointer;font-weight:800}
.sync{font-size:.85rem;font-weight:700;border-radius:10px;padding:8px 12px;margin:10px 0}
.sync.ok{background:var(--okbg);color:#124d33}.sync.wait{background:#fff3cf;color:#6b4b00}.sync.off{background:#e8e4f3;color:#3a2f5a}
.cert{display:none}
.foot{text-align:center;color:#ffffffaa;font-size:.8rem;margin-top:26px}
.foot a{color:var(--gold2);cursor:pointer;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--night);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 8px 24px #0008;z-index:50;max-width:90%;text-align:center;border:1px solid var(--gold)}
.overlay{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--parch);border-radius:18px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 50px #000a}
.modal h3{font-size:1.3rem;margin-bottom:8px;color:var(--night2)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
@media print{
  body{background:#fff!important}
  #app>*:not(.cert),.toast,canvas#fx,.foot{display:none!important}
  .cert{display:block!important}
}
.cert{background:#fffdf5;border:6px double #b8861f;border-radius:10px;padding:34px 24px;text-align:center;color:#2b2140;margin-top:16px}
.cert h2{font-size:1.9rem;color:#7a2e4d}
.cert .nm{font-family:var(--font-head);font-size:1.8rem;border-bottom:2px solid #b8861f;display:inline-block;padding:4px 26px;margin:12px 0}
</style>
</head>

 "3":{"id": 3, "tipe": "pg", "wacana": "Saat mengikuti perkemahan, Dewi memperhatikan api unggun yang menyala besar. Dari kobaran api itu, percikan-percikan kecil beterbangan ke udara. Meski ukurannya kecil dan terpisah, percikan itu memiliki sifat yang sama dengan api induknya, yaitu panas dan bercahaya. Guru pembina mengajak para siswa merenungkan peristiwa itu sebagai perumpamaan ajaran Upanisad tentang hubungan Tuhan dan manusia.", "tanya": "Perumpamaan tersebut paling tepat menggambarkan hubungan Brahman dan Atman, yaitu ....", "opsi": {"A": "Atman sama sekali berbeda dari Brahman karena ukurannya jauh lebih kecil", "B": "Atman adalah ciptaan Brahman yang terpisah sepenuhnya dan tidak berhubungan lagi", "C": "Brahman akan berkurang dan habis jika terus memercikkan Atman ke banyak makhluk", "D": "Atman adalah percikan kecil Brahman yang hakikatnya sama dengan Brahman", "E": "Atman dan Brahman baru bersatu setelah badan manusia mengalami kematian"}, "kunci": ["D"], "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAGQAoADASIAAhEBAxEB/8QAHAABAQACAwEBAAAAAAAAAAAAAAEDBAIFBgcI/8QAORABAAICAQMDAwICCQMEAwAAAAECAxEEBRIhBjFBE1FhInEygQcUQlJikaGxwRUjMzRygtEkQ/H/xAAaAQEBAAMBAQAAAAAAAAAAAAAAAQIDBAUG/8QAJxEBAAICAgICAwACAwEAAAAAAAECAxEEEiExBRMiQVEUMiNhoYH/2gAMAwEAAhEDEQA/APkAo7WKCgJo0oCKAAGgAABQEFAQUBBQEFAQUUQUAAAAAABY92fDXcww1bXHjzDCyw3+Hgm8xEQ9R0n07y+f/wCnwXv95iPEfvLQ9PcX+scjHjjW72isb/L7n0/hYuHxsfHwVitKRrx8z93jc7lzinVfbqx0jW5fIeq+l+bwcfdyOPatf73vH+cPLc3jzjmYmH6Nz4aZMdqZKxalo1NZjxMPi3rHp1eD1DPgj2rb9P7fDDhcy2S3W3svSNbh4XNXUy1rR5b3JrqZado8vcrPhyy4LVFhkjc486mHpeh54pkr5eVxW1Ls+Fyfp2idubNTtGm2k6l+i+kZ6Z+n8bJSd1tjr/s272jT4/6e9YcjptPp1mt8U/8A67+2/vDf6p685PI49sWKuPDFomLTTczMfzfOW4OXvqPTp3WfLU9ac3Hm6lyLYpjt7piJj518vH2z9t97cufzpy2mduryZvPu9zBh6UirTe+5eu4XrLqnEwRhxcy3ZWIisWiLaj7Rt1HWut8rqmT6nL  "4":{"id": 4, "tipe": "pg", "wacana": "Ketika menjelaskan tentang Tuhan, Bu Guru memaparkan tiga ciri: Tuhan tidak dibatasi oleh ruang dan waktu, tidak dapat digambarkan dalam satu bentuk tertentu, dan hadir meresapi segala sesuatu, dari butiran pasir hingga bintang di langit. Para siswa diminta menyimpulkan hakikat Tuhan menurut Upanisad berdasarkan ketiga ciri tersebut.", "tanya": "Kesimpulan yang tepat mengenai hakikat Brahman menurut Upanisad adalah ....", "opsi": {"A": "Brahman adalah realitas tertinggi yang tidak terbatas, tidak berwujud, dan meresapi seluruh ciptaan", "B": "Brahman adalah dewa tertinggi yang bersemayam di satu tempat suci dan berwujud tetap", "C": "Brahman adalah roh leluhur yang berada di setiap rumah dan harus dipuja dengan sesajen", "D": "Brahman adalah kekuatan alam yang hanya tampak pada matahari dan api", "E": "Brahman adalah jiwa manusia yang terbatas pada masa hidupnya di dunia"}, "kunci": ["A"], "img": null, "cap": null},
 "5":{"id": 5, "tipe": "pg", "wacana": "Seorang dokter muda menjelaskan kepada keluarga pasien bahwa jantung pasien telah berhenti berdetak dan organ tubuhnya tidak lagi berfungsi. Keluarga merasa bahwa ada sesuatu yang telah pergi dari tubuh pasien: tubuhnya masih utuh, tetapi tidak lagi hidup. Peristiwa itu mengingatkan Ketut pada ajaran gurunya tentang unsur jasmani dan unsur rohani dalam diri manusia.", "tanya": "Peristiwa tersebut paling tepat dianalisis dengan ajaran Upanisad bahwa ....", "opsi": {"A": "badan jasmani adalah sumber kehidupan, sedangkan Atman hanya pelengkap", "B": "Atman ikut musnah bersama hancurnya badan jasmani", "C": "Atman hanya berada di otak dan berhenti ketika otak tidak berfungsi", "D": "hidup manusia bergantung sepenuhnya pada makanan yang dikonsumsinya", "E": "Atman adalah unsur rohani sumber kehidupan, sehingga badan jasmani mati bila Atman meninggalkannya"}, "kunci": ["E"], "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAGQAoADASIAAhEBAxEB/8QAHAABAQADAQEBAQAAAAAAAAAAAAECAwQFBgcI/8QAQRAAAgECBAQDBQUECAcBAAAAAAECAxEEEiFRBTFBYQYTgSIycXKRMzVCUrEVI3OyBxRDYoKSocEWJCU0U1TR4f/EABkBAQEBAQEBAAAAAAAAAAAAAAABAgMEBf/EACcRAQACAgICAgICAgMAAAAAAAABAgMRBCESMUFREyIUYTKRBaHR/9oADAMBAAIRAxEAPwD8zsCix7WEBQBCgABYoAgLYAQFAEKAAAACwLYAQFAEBQBAUAQFBRCgALCxbACBIplFECMbm+nSuWjTu1oepg8G6jSSOdraaiHJSwzfQ7KWDk/wn03CvD1bEtKnSlJ9kfWYHwVOydeUKfbmzxZOVWrpFH5vT4fN/hOmHDJv8LP1ah4TwVO2eU572SR2U/D/AA6Ct5Gb5pM888z6hrxh+Rx4VU/KzL9k1Pys/YYcJwMY2WFp+quZfsvBf+rS/wApj+XP0uqvxz9k1Pysxlwqp+Vn7L+y8F/6tL/KYz4TgZRs8LT9FYfy5+jUPxafDJr8LOapw+a/CftdTw/w6at5GX5ZM46/hPBVL5JThtdJm45n3CeMPxarg5L8Jx1cM10P17HeCp2boShU7cmfJ8V8PVsM2qlKUX3R6MfKrZmaPg6lKxolGx7mMwbptpo8utTs3oe2ttucw5GgZyRidGUsLFFiiELYAQFAEBQQQFAEBQBBYosBAAAIUAQFAEBQBLAoAhCgCAoAgsUAUWLYBUBRYCAoAgMrACWBQBAWwAgKAIC2KBiWxQBAUWAgLYAQFBR  "6":{"id": 6, "tipe": "pg", "wacana": "Pak Guru menuliskan kutipan Chandogya Upanisad VI.8.7 di papan tulis: “Sa ya eṣo ’ṇimaitad ātmyam idaṃ sarvaṃ tat satyaṃ sa ātmā tat tvam asi Śvetaketo.” Beliau menjelaskan bahwa Resi Uddalaka mengucapkan sloka itu kepada putranya, Swetaketu, setelah memberi perumpamaan garam yang larut dalam air: tidak terlihat, tetapi terasa pada seluruh bagian air.", "tanya": "Makna sloka tersebut, terutama bagian “tat tvam asi”, yang paling tepat adalah ....", "opsi": {"A": "Swetaketu harus menjadi murid yang paling patuh kepada gurunya", "B": "Hakikat tertinggi yang halus dan meresapi segalanya itu pada dasarnya sama dengan Atman dalam diri Swetaketu", "C": "Garam dan air adalah dua benda berbeda yang tidak mungkin bersatu", "D": "Kebenaran hanya dapat diperoleh melalui pengorbanan hewan", "E": "Manusia harus berusaha menjadi Brahman melalui kekuatan jasmani"}, "kunci": ["B"], "img": null, "cap": null},
 "7":{"id": 7, "tipe": "pg", "wacana": "Dua siswa membahas Mahawakya dalam Upanisad. Siswa pertama mengutip “Aham Brahmasmi” dari Brihadaranyaka Upanisad, sedangkan siswa kedua mengutip “Ayam Atma Brahma” dari Mandukya Upanisad. Keduanya sepakat bahwa kedua pernyataan itu berbicara tentang hubungan manusia dengan Tuhan, tetapi mereka belum yakin tentang perbedaan sudut pandang makna masing-masing.", "tanya": "Perbandingan makna kedua Mahawakya tersebut yang paling tepat adalah ....", "opsi": {"A": "“Aham Brahmasmi” bermakna “Atman ini adalah Brahman”, sedangkan “Ayam Atma Brahma” bermakna “Aku adalah Brahman”", "B": "“Aham Brahmasmi” menyatakan manusia berbeda dari Brahman, sedangkan “Ayam Atma Brahma” menyatakan manusia sama dengan Brahman", "C": "“Aham Brahmasmi” bermakna “Aku adalah Brahman” (kesadaran akan kesatuan diri dengan Brahman), sedangkan “Ayam Atma Brahma” bermakna “Atman ini adalah Brahman” (penegasan hakikat Atman)", "D": "Kedua Mahawakya bermakna “Itulah engkau” dan hanya berlaku bagi para resi", "E": "Kedua Mahawakya menyatakan bahwa Brahman hanya ada dalam tubuh manusia yang telah meninggal"}, "kunci": ["C"], "img": null, "cap": null},
 "8":{"id": 8, "tipe": "pg", "wacana": "Di sebuah SMA, sekelompok siswa kelas XII sering mengejek dan mengucilkan Rendi, teman sekelas mereka yang bertubuh kecil dan pendiam. Rendi mulai enggan masuk sekolah dan prestasinya menurun. Salah satu pelaku, Arya, awalnya menganggap semua itu hanya bercanda. Setelah dibina guru agama, ia diajak merenungkan konsep Tat Twam Asi.", "tanya": "Penilaian yang tepat terhadap perilaku para pelaku berdasarkan konsep Tat Twam Asi adalah ....", "opsi": {"A": "Perilaku itu wajar karena setiap siswa berhak bercanda dengan temannya", "B": "Perilaku itu dapat dibenarkan jika korban memang memiliki kekurangan", "C": "Perilaku itu tidak berkaitan dengan ajaran agama karena hanya masalah antarpribadi", "D": "Perilaku itu cukup diselesaikan dengan meminta Rendi lebih berani membela diri", "E": "Perilaku itu keliru karena menyakiti orang lain berarti menyakiti diri sendiri, sebab Atman semua makhluk bersumber dari Brahman yang sama"}, "kunci": ["E"], "img": null, "cap": null},
 "11":{"id": 11, "tipe": "pg", "wacana": "Dalam sebuah seminar kecil, tiga orang menyampaikan pandangan tentang tujuan hidup. Anom berkata, “Tujuan hidup adalah mengumpulkan harta sebanyak mungkin agar sejahtera.” Dewa berkata, “Tujuan hidup adalah meninggalkan urusan duniawi dan menyepi.” Sementara itu, Ngurah berkata, “Kita bekerja sungguh-sungguh agar sejahtera, tetapi semuanya dilandasi dharma agar akhirnya mencapai kebahagiaan abadi.”", "tanya": "Berdasarkan konsep Moksartham Jagadhita ya ca iti Dharma, pandangan yang paling seimbang adalah ....", "opsi": {"A": "Pandangan Anom, karena kesejahteraan duniawi adalah tujuan tertinggi yang harus dikejar lebih dahulu", "B": "Pandangan Ngurah, karena Jagadhita dan Moksa dicapai secara seimbang dengan landasan Dharma", "C": "Pandangan Dewa, karena Moksa hanya dapat dicapai dengan meninggalkan kehidupan duniawi sepenuhnya", "D": "Pandangan Anom dan Dewa, karena keduanya saling melengkapi tanpa memerlukan Dharma", "E": "Ketiganya sama benar, karena tujuan hidup ditentukan oleh selera masing-masing"}, "kunci": ["B"], "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAGQAoADASIAAhEBAxEB/8QAGwAAAwADAQEAAAAAAAAAAAAAAAECAwUGBAf/xABMEAABAwICBwMIBQkHBAEFAAABAAIRAwQFIQYSEzFRYZFBUqEUIkJUcYGx0RYyU2KTBxUjM3KCssHhNTZDY2SSoyRE8PE0JSZVg6L/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/8QALREBAAICAQMDBAICAgMBAAAAAAERAgMSBCExQVFSEzIzcRQiBWFCkUNTofH/2gAMAwEAAhEDEQA/APTCcJwnC+y+amE4ThOFRMJwnCcIJhEKoRCBQiFUIhAoRCqEQgmE4ThOFRMIhVCIQKEQqhEIJhOE4ThBMIhVCIQTCcJwnCImEQqhEIJhEKoRCBQiE4RCBQiFUIhBMIhVCIQTCIVQiEEwiFUIhBMIhVCIVEwiFUIhBMIhVCIUEwiFUIhBMIhVCIQTCIVQiEEwiE4RCCYRCqEQgmEQqhEIJhKFcJQgmEQqhEIqYShXCUIJhEKoRCCIRCqEQgmEoVwlCCYRCqEQoIhEKoRCCIRCqEQgmEoVwlCCYShXCUIJhKFcJQoLhEJwnCKmE4VQiEEwnCqEQgmEQrhEIJhEKoThBMIhVCIQKEQqhEIJhOE4RCqFCIVQiEEwiFUJoJhEKoRCCYRCqE4QTCI  "13":{"id": 13, "tipe": "pg", "wacana": "Seorang yogi tinggal di pertapaan di kaki gunung. Ia masih menjalani kehidupan sehari-hari: makan, mengajar para murid, dan merawat taman. Namun batinnya tenang, tidak terguncang oleh pujian maupun hinaan, tidak terikat pada harta, dan hidupnya sepenuhnya diabdikan kepada Tuhan serta kesejahteraan sesama.", "tanya": "Jenis Moksa yang dicapai yogi tersebut adalah ....", "opsi": {"A": "Jiwanmukti, yaitu kebebasan atman ketika masih hidup di dunia", "B": "Widehamukti, yaitu kebebasan atman setelah meninggalkan badan", "C": "Paramamukti, yaitu penyatuan sempurna atman dengan Brahman", "D": "Swargaloka, yaitu kebahagiaan sementara di alam dewa", "E": "Punarbhawa, yaitu kelahiran kembali yang terus berulang"}, "kunci": ["A"], "img": null, "cap": null},
 "16":{"id": 16, "tipe": "pg", "wacana": "Pak Wayan adalah petani di Karangasem. Setiap pagi ia mengolah sawah berundaknya dengan penuh ketekunan. Sebelum bekerja, ia mempersembahkan bunga di pura subak dan berniat bahwa seluruh jerih payahnya adalah persembahan kepada Tuhan. Ia tidak mengeluh walau hasil panen kadang menurun, dan tetap membagi sebagian hasilnya kepada tetangga yang membutuhkan.", "tanya": "Marga dalam Catur Marga yang ditempuh Pak Wayan pada kasus tersebut adalah ....", "opsi": {"A": "Jnana Marga, karena ia mendalami ilmu pertanian", "B": "Raja Marga, karena ia mengendalikan pikirannya saat bekerja", "C": "Karma Marga, karena ia bekerja tanpa mengharapkan hasil dan mempersembahkannya kepada Tuhan", "D": "Bhakti Marga, karena ia hanya menekankan persembahan bunga tanpa bekerja", "E": "Raja Marga, karena ia bermeditasi di sawah sepanjang hari"}, "kunci": ["C"], "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAGQAoADASIAAhEBAxEB/8QAGwAAAwADAQEAAAAAAAAAAAAAAAECAwQFBgf/xABKEAABBAABCAYGBgkDAwMFAAAAAQIDEQQFEhMhMVFSkRQVQVNhkiJUcYGh0QYyYqLB4RYjMzRCQ2NysXOCo0Rk8CQ1g5OywuLx/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QAMxEBAAEDAwEGBAUFAQEBAAAAAAECAxESE1EUBCExQVKhU2GR4SIyQmLwFXGBsdEFJCP/2gAMAwEAAhEDEQA/AOxQ6HQ6PtPlJodDodATQ6HQ6Amh0OgoIVDodBRQqCiqCgFQUVQUAkQyxtJRDPE3WZmViG1hY7VD0mAhzI0cvacjJsOe9qeJ6JrURERNiHze019+l7rNPdkIgxgeeHch0OgKEJzUciovaUFEkcHKOHVrl1HGmZSqevxsKSRKta0PM4uLNcuo93Z7mqHkvUYlzXJrJozPaY1Q90S8kwmgodBRQqCiqCgJoKKoKCJoKKoKAVBQ6CgFQUOgoBUFDoKAVBQ6CgFQqKoKAmgoqgoCaCiqCgqaCh0FATQUVQUBNBRVBQE0Ki6FRBNBRVBQEUFFUFATQqLoVATQUVQUBFBRVBQEUFFUFATQqKoKAmhUXQqIJoVF0KgqaFRdCoCaFRdCAqh0OhkVNBRVDoCaCiqHQE0BVDoImgoqgoBUFFUFFCoKKoKAGprNmFNaGBqGzDtQxU1S7uR2emi7kOwhyckO9Kt6HXQ+Ve/O+hb/ACgBjMtkAwAAGAEqloqHncpRZr3J4npDh5WT9a72nTs84rc7sZpcCRNamFUNmVNamByaz6lL58ooKKoKNslQUOh0BNBRVBR  "17":{"id": 17, "tipe": "pg", "wacana": "Ni Luh Sari, siswi kelas XI, menyisihkan waktu setiap sore untuk membaca Bhagawadgita, Upanisad, dan buku filsafat Hindu. Ia sering berdiskusi dengan gurunya dan menulis ringkasan makna yang dipahaminya. Baginya, memahami hakikat Atman dan Brahman melalui pengetahuan adalah cara terbaik untuk mendekatkan diri kepada Tuhan.", "tanya": "Jalan Catur Marga yang ditempuh Ni Luh Sari adalah ....", "opsi": {"A": "Bhakti Marga, yaitu jalan cinta kasih dan pengabdian melalui persembahyangan", "B": "Jnana Marga, yaitu jalan pengetahuan melalui pendalaman kitab suci dan filsafat", "C": "Karma Marga, yaitu jalan pengabdian melalui perbuatan tanpa pamrih", "D": "Raja Marga, yaitu jalan pengendalian diri melalui yoga dan meditasi", "E": "Semua marga sekaligus, karena ia belajar setiap sore"}, "kunci": ["B"], "img": null, "cap": null},
 "18":{"id": 18, "tipe": "pg", "wacana": "Pada hari Purnama, Komang mengikuti rangkaian kegiatan di pura desa. Pagi hari ia bersembahyang bersama keluarga, siang hari ngayah membantu membuat banten dan membersihkan pura, sore hari mendengarkan dharma wacana dari pinandita, dan malam hari duduk bermeditasi sejenak di halaman pura. Komang merasa keempat kegiatan itu saling melengkapi dalam membawanya lebih dekat kepada Tuhan.", "tanya": "Keterkaitan keempat kegiatan tersebut dalam Catur Marga yang paling tepat adalah ....", "opsi": {"A": "Persembahyangan (Bhakti), ngayah (Karma), dharma wacana (Jnana), dan meditasi (Raja) saling melengkapi sebagai jalan menuju Moksa", "B": "Persembahyangan (Karma), ngayah (Bhakti), dharma wacana (Raja), dan meditasi (Jnana) saling melengkapi sebagai jalan menuju Moksa", "C": "Keempat kegiatan seluruhnya termasuk Bhakti Marga sehingga tidak memiliki perbedaan", "D": "Hanya persembahyangan dan meditasi yang termasuk Catur Marga, sedangkan ngayah dan dharma wacana tidak", "E": "Keempat kegiatan harus dipilih salah satu saja sehingga tidak perlu saling melengkapi"}, "kunci": ["A"], "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAGQAoADASIAAhEBAxEB/8QAGwAAAwADAQEAAAAAAAAAAAAAAAECAwQFBgf/xABDEAACAgECBAMFBAcFCAMBAQAAAQIRAwQSBSExURNBYQYiUnGRFFOBoRUjMpOx0eEzQpLB8CQlNUNiY3JzNIKyg/H/xAAaAQEBAAMBAQAAAAAAAAAAAAAAAQIDBAUG/8QAMREBAAICAgIBAwIEBAcAAAAAAAERAgMEIRIxQQUTIlFxIzIzYRWBkbFCUmKhweHw/9oADAMBAAIRAxEAPwCqHQ6HR6zjTQ6HQUAqCiqCgFQUVQUAqCh0OgJodDodATQUVQUUKgoqgoCaHQ6HQE0FFUFATQ6HQ6AmgoqgoWJoKKoKFoVBQ6ChYVBRVBQsTQUVQULE0FFUFCxNBRVBQCoKHQUAqCh0FAKgodBQCoKHQUBNBRVBQE0FFUFCxNBRVBQsTQUVQULE0FDoKFiaCiqChYmgoqgoWJoVF0KhapoKKoKFiaFRdCoCaCiqCgIoKKoKAmhUXQqIJoKKoKAigoqgoCKCiqCgJoVFUFATQqLoVAVQUVQUYqVBRVBQCoKHQ6Amh0Oh0WxNDodBQsKgoqgoWFQUOh0LE0Oi4QlN1FNmytC4rdnyQx  "21":{"id": 21, "tipe": "pg", "wacana": "Dalam rapat banjar, seorang peserta berkata bahwa pemimpin hanya bertugas memberi perintah dan masyarakat wajib mengikutinya. Peserta lain menanggapi bahwa dalam ajaran Hindu pemimpin adalah pelayan masyarakat yang membimbing, melindungi, dan mengambil keputusan berlandaskan dharma demi kesejahteraan bersama.", "tanya": "Prinsip dasar kepemimpinan Hindu yang tercermin dalam tanggapan peserta kedua adalah ....", "opsi": {"A": "pemimpin berkuasa mutlak karena dipilih oleh masyarakat", "B": "pemimpin mengutamakan keuntungan kelompoknya agar kekuasaan stabil", "C": "pemimpin menjalankan kepemimpinan berlandaskan dharma untuk melayani dan mensejahterakan masyarakat", "D": "pemimpin dibenarkan mengambil keputusan sendiri tanpa mendengarkan siapa pun", "E": "pemimpin dihormati karena garis keturunan, bukan karena tindakannya"}, "kunci": ["C"], "img": null, "cap": null},

 "24":{"id": 24, "tipe": "pg", "wacana": "Saat kampanye pemilihan ketua OSIS, seorang calon berjanji menyediakan fasilitas tambahan bagi seluruh siswa. Setelah terpilih, ia tidak menepati satu pun janjinya dan menyalahkan siswa lain atas kegagalannya. Ia juga berkata kasar kepada pengurus lain dan berbuat curang dalam laporan keuangan kegiatan.", "tanya": "Pelanggaran terhadap Tri Kaya Parisudha yang dilakukan ketua OSIS tersebut adalah ....", "opsi": {"A": "Manacika dan Wacika, karena ia hanya berpikir buruk dan berkata kasar", "B": "Manacika dan Kayika, karena ia berniat buruk dan berbuat curang", "C": "Wacika saja, karena ia hanya mengingkari janji yang diucapkannya", "D": "Wacika dan Kayika, karena ucapannya tidak benar dan tidak ditepati, serta perbuatannya curang", "E": "Kayika saja, karena hanya tindakan nyata yang dapat disebut pelanggaran"}, "kunci": ["D"], "img": null, "cap": null},
 "25":{"id": 25, "tipe": "pg", "wacana": "Dalam Ramayana, Raja Dasarata pernah berjanji kepada Dewi Kekayi akan mengabulkan dua permintaannya. Kekayi menuntut agar putranya, Bharata, dinobatkan sebagai raja dan Sri Rama diasingkan ke hutan selama empat belas tahun. Meski berhak atas takhta dan dicintai rakyat, Sri Rama menerima keputusan itu dengan lapang dada demi menjaga kehormatan janji ayahnya.", "tanya": "Keteladanan kepemimpinan Sri Rama yang paling tepat dinilai dari kisah tersebut adalah ....", "opsi": {"A": "kepatuhan buta kepada orang tua tanpa pertimbangan dharma", "B": "kelemahan karena tidak mampu mempertahankan haknya", "C": "kecerdikan menghindari tugas negara", "D": "ambisi memperoleh dukungan rakyat", "E": "keteguhan menjunjung satya (menepati janji dan kebenaran) serta bakti kepada orang tua dengan mengutamakan dharma di atas kepentingan pribadi"}, "kunci": ["E"], "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAGQAoADASIAAhEBAxEB/8QAGwAAAwADAQEAAAAAAAAAAAAAAAECAwQFBgf/xAA8EAACAgECBAIGBwcEAwEAAAAAEQECAwQFEiExURNBIjJhcYGRBhRCUoKSwSQzNFNiobEVI0PRcuHwg//EABkBAQEBAQEBAAAAAAAAAAAAAAABAgMEBf/EACMRAQEBAQADAQEBAAMAAwAAAAARAQIDEiExUQQTFEEiIzL/2gAMAwEAAhEDEQA/APLoEUgR7HqShoaGgJQIpAgJQ0NDQolAikCFEoEUhoUSgRSBCqlAikNAQhopAhRKBFIEBKBFIEKEgRSBASgRSBASgRSBASgRSBASgRSBASgRSGgIQItAgIQItAgIQItAhRCBFoEKIQItAgIQItAgIQItCQEoEUgQEoEUgQEoEUgQEoEUgQEoEUgQEIEUgQolAikCAlCRaBCiECLQkBKBFIEKIQItCQqJQIpAhRKEi0JCiUCKQICUJFoSAlAikCApAikCMqlAikNAiUCKQICUNFIEBKBFIaAhDRSBCiUCKQIVUoaKQIVEoEUgQqpQIpAhRKGikCFEoEUgQolAikCFEoEUgRaJQIpDRKJQIpAiiUCKQICUCKQICUCKQICUCKQIUSgRSBCiUCKQICUCKQICUCKQICUCKQICECLQkSiUCKQItEoEUgRKJQIpAhRKBFIEKIQIpAhRKBFIEKJQkWgQohAikCFEoSLQIVEIEWhICUJFoEBCBFIEBCBFoSBEoEUgQFIEUgRmqlDRSBCiUNDQ0KJQIpAgJQ0NAgEgRSBBUoaGgQCQIaGi0SgRSBASgRSBCiUCLQIUSgRSBCiUCKQIUSgRaBCiECLQIUQhop  "29":{"id": 29, "tipe": "pgk", "wacana": "Dalam kegiatan diskusi kelas, Pak Guru membagikan lima pernyataan tentang hubungan Brahman dan Atman menurut Upanisad. Setiap kelompok diminta menelaah pernyataan-pernyataan tersebut dan memilih yang sesuai dengan ajaran Upanisad. Hasil diskusi akan dijadikan bahan kesimpulan pelajaran hari itu.", "tanya": "Pilihlah DUA pernyataan yang benar tentang hubungan Brahman dan Atman!", "opsi": {"A": "Atman dan Brahman adalah dua hal yang sama sekali terpisah dan tidak pernah berhubungan.", "B": "Atman bersumber dari Brahman dan pada hakikatnya sama dengan Brahman.", "C": "Atman baru ada setelah bayi lahir dan lenyap ketika badan meninggal.", "D": "Brahman hanya berada di satu tempat suci sehingga Atman hanya dapat bersatu dengannya di sana.", "E": "Atman bersifat kekal dan tidak ikut musnah ketika badan jasmani mati."}, "kunci": ["B", "E"], "img": null, "cap": null},
 "30":{"id": 30, "tipe": "pgk", "wacana": "Seorang pandita sepuh di sebuah griya dikenal oleh masyarakat sebagai sosok yang sangat tenang. Ia masih menjalani kehidupan sehari-hari seperti mengajar dan memberi nasihat, tetapi tidak terguncang ketika dipuji maupun dicela, dan tidak terikat pada hasil perbuatannya. Para siswa yang berkunjung diminta menelaah pernyataan tentang ciri kondisi Moksa untuk menentukan jenis Moksa yang tampak pada beliau.", "tanya": "Pilihlah DUA pernyataan yang sesuai dengan ciri Jiwanmukti!", "opsi": {"A": "Dicapai ketika seseorang masih hidup dalam badan jasmani.", "B": "Atman telah lepas dari badan dan tidak akan terlahir kembali.", "C": "Atman telah menyatu sepenuhnya dengan Brahman tanpa sifat apa pun.", "D": "Batin tidak terguncang oleh suka-duka dan tidak terikat pada hasil perbuatan.", "E": "Hanya dapat dicapai setelah kematian dan pelaksanaan upacara pelebon."}, "kunci": ["A", "D"], "img": null, "cap": null},
 "31":{"id": 31, "tipe": "pgk", "wacana": "Dalam rangka menyambut hari suci Saraswati, OSIS menyusun daftar kegiatan keseharian yang akan dibahas pada kajian agama. Siswa diminta menelaah perilaku-perilaku berikut dan mengelompokkannya ke dalam jalan Catur Marga.", "tanya": "Pilihlah DUA perilaku yang mencerminkan pelaksanaan Karma Marga dan Bhakti Marga!", "opsi": {"A": "Mempelajari kitab Upanisad hingga larut malam tetapi tidak pernah bersembahyang.", "B": "Bermeditasi berjam-jam sambil mengabaikan tugas dan kewajiban di rumah.", "C": "Ngayah membantu persiapan upacara di pura tanpa mengharapkan imbalan.", "D": "Membantu orang lain hanya apabila diberi bayaran yang besar.", "E": "Menghaturkan sembah dan melantunkan kidung suci dengan tulus kepada Tuhan."}, "kunci": ["C", "E"], "img": null, "cap": null},
 "32":{"id": 32, "tipe": "pgk", "wacana": "Kepala desa terpilih di sebuah desa wisata diamati warganya selama satu bulan pertama masa jabatan. Warga mencatat beberapa tindakan sang pemimpin, lalu membahasnya dalam pertemuan banjar untuk menilai apakah tindakan itu sesuai dengan ajaran Asta Brata, yaitu delapan sifat kepemimpinan yang diteladani dari kebesaran para dewa.", "tanya": "Pilihlah DUA tindakan pemimpin yang mencerminkan ajaran Asta Brata!", "opsi": {"A": "Menghabiskan anggaran desa untuk keperluan pribadi dan kemewahan keluarganya.", "B": "Menjatuhkan sanksi kepada pelanggar aturan secara adil tanpa pandang bulu.", "C": "Membela kerabat yang bersalah agar terhindar dari hukuman.", "D": "Turun langsung ke dusun-dusun untuk mengetahui kondisi dan keluhan warga.", "E": "Menghindari pertemuan dengan warga agar tidak diganggu oleh keluhan."}, "kunci": ["B", "D"], "img": null, "cap": "Gambar 13. Dua orang siswa yang saling menolong"}

{ik:"📜", t:"Weda & Upanisad", h:`
<p>Kata <b>Weda</b> berasal dari akar kata <i>vid</i> yang berarti “tahu”. Weda adalah pengetahuan suci yang diwahyukan Tuhan dan menjadi sumber utama ajaran Hindu.</p>

<div class="tblwrap"><table class="tbl"><tr><th>Bagian</th><th>Isi pokok</th></tr>

<h3>Arti kata Upanisad</h3>
<p><b>Upa</b> (dekat) + <b>ni</b> (di bawah) + <b>sad</b> (duduk) = <b>“duduk dekat di bawah (kaki) guru”</b> untuk menerima ajaran kerohanian tentang kebenaran tertinggi. Upanisad diajarkan secara lisan dari guru kepada murid yang siap, dengan penuh hormat dan ketekunan (<i>guru-sisya parampara</i>).</p>

<h3>Fungsi Upanisad</h3>

{ik:"🏔️", t:"Moksa & Tujuan Hidup", h:`
<div class="box sloka">“Moksartham Jagadhita ya ca iti Dharma” — Dharma bertujuan untuk mencapai <b>Moksa</b> (kebebasan/kebahagiaan abadi) dan <b>Jagadhita</b> (kesejahteraan hidup di dunia).</div>
<p>Tujuan hidup umat Hindu dapat dipahami lewat <b>Catur Purusartha</b>: <b>Dharma</b> (kebenaran/kewajiban), <b>Artha</b> (harta), <b>Kama</b> (keinginan/kenikmatan), dan <b>Moksa</b> (kebebasan). Artha dan Kama sah dikejar, <b>asal dilandasi Dharma</b>.</p>

{ik:"🪷", t:"Catur Marga", h:`

{ik:"👑", t:"Kepemimpinan Hindu", h:`

function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
const fmt=n=>{const x=Math.round(n*10)/10;return Number.isInteger(x)?String(x):x.toFixed(1).replace('.',',')};

function clearTimers(){timers.forEach(t=>clearInterval(t));timers=[]}
function toast(m,ms=2600){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}
function modal(title,html,buttons){

  document.body.appendChild(o);
}

/* confetti */
function confetti(){
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=Array.from({length:130},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,vx:-2+Math.random()*4,vy:2+Math.random()*4,col:['#f0b94a','#ef7b2c','#ffd98a','#fff','#c23b8a','#4cc58b'][Math.floor(Math.random()*6)],a:Math.random()*6}));
  let f=0;(function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.fillStyle=p.col;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++f<170)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})();
}

const isRight=(id,ans)=>{const k=SOAL[id].kunci.slice().sort().join('');return (ans||[]).slice().sort().join('')===k};
function countRight(q,set){return set.filter(id=>isRight(id,q.ans[id])).length}
function nilaiAkhir(){return Math.round((CONFIG.BOBOT_T4*S.q4.skor+CONFIG.BOBOT_T5*S.q5.skor)*10)/10}
function predikat(n){return n>=90?'Sangat Baik':n>=80?'Baik':n>=CONFIG.KKM?'Cukup (Tuntas)':'Perlu Bimbingan'}
function doneCount(){let n=0;for(let i=0;i<5;i++){if(S.done[i])n++;else break}return n}
function xp(){let x=0;if(S.done[0])x+=50;x+=S.materi.n*10+S.terap.n*10;if(S.q4.selesai)x+=S.q4.benar*10;if(S.q5.selesai)x+=S.q5.benar*10;return x}
const XP_MAX=50+70+60+100+150;
function fmtAns(q,set){return set.map(id=>id+':'+(((q.ans[id]||[]).slice().sort().join(''))||'-')).join(',')}
function durasi(){const end=S.selesai?new Date(S.selesai):new Date();return Math.round((end-new Date(S.mulai))/6000)/10}
function payload(ev){
  return {event:ev,id:S.id,nama:S.nama,kelas:S.kelas,absen:S.absen,mulai:S.mulai,
    tahap_selesai:doneCount(),
    skor4:S.q4.selesai?S.q4.skor:'',benar4:S.q4.selesai?S.q4.benar:'',
    skor5:S.q5.selesai?S.q5.skor:'',benar5:S.q5.selesai?S.q5.benar:'',
    nilai_akhir:S.q5.selesai?nilaiAkhir():'',predikat:S.q5.selesai?predikat(nilaiAkhir()):'',
    refleksi:S.terap.refleksi||'',durasi_menit:durasi(),pindah_tab:(S.q4.tab||0)+(S.q5.tab||0),
    jawaban4:S.q4.selesai?fmtAns(S.q4,S.q4.order):'',jawaban5:S.q5.selesai?fmtAns(S.q5,S.q5.order):'',
    status:S.q5.selesai?'Selesai':'Sedang mengerjakan (tahap '+(doneCount()+1)+')',
    kirim:new Date().toISOString()};
}
let syncState=CONFIG.SHEET_URL?'wait':'off';
function getQueue(){try{return JSON.parse(lsGet(CONFIG.KUNCI_STORAGE+'_q')||'[]')}catch(e){return[]}}
function setQueue(q){lsSet(CONFIG.KUNCI_STORAGE+'_q',JSON.stringify(q))}
async function postOne(p){
  await fetch(CONFIG.SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
}
async function flush(){
  if(!CONFIG.SHEET_URL){syncState='off';return}
  const q=getQueue();if(!q.length){syncState='ok';return}
  syncState='wait';
  const rest=[];
  for(const p of q){try{await postOne(p)}catch(e){rest.push(p)}}
  setQueue(rest);syncState=rest.length?'fail':'ok';
  if(view==='hasil'||view==='s4'||view==='map')updateSync();
}
function send(ev){
  if(!S)return;
  if(!CONFIG.SHEET_URL)return;
  const p=payload(ev);
  const q=getQueue();q.push(p);setQueue(q);flush();
}
function syncHTML(){
  if(!CONFIG.SHEET_URL)return `<div class="sync off">ℹ️ Mode uji coba: alamat Google Sheets belum diisi, jadi hasil belum dikirim ke rekap guru. Gunakan tombol “Unduh cadangan hasil”.</div>`;
  if(syncState==='ok')return `<div class="sync ok">☁️ Hasilmu sudah dikirim ke rekap guru.</div>`;
  if(syncState==='fail')return `<div class="sync wait">⚠️ Hasil belum terkirim (periksa internet). Akan dicoba lagi otomatis. <button class="btn small" onclick="flush().then(updateSync)">Kirim ulang</button></div>`;
  return `<div class="sync wait">⏳ Mengirim hasil ke rekap guru…</div>`;
}
function updateSync(){const e=$('#sync');if(e)e.innerHTML=syncHTML()}
window.addEventListener('online',flush);

function vS2(){
  const n=S.materi.n; if(ctx.pos===undefined||ctx.pos>n)ctx.pos=Math.min(n,MATERI.length-1);
  const p=ctx.pos,m=MATERI[p],isDone=p<n||S.done[1];
  const side=MATERI.map((x,i)=>`<button class="pos ${i===p?'cur':''} ${i<n?'done':''}" ${i>n&&!S.done[1]?'disabled':''} onclick="ctx.pos=${i};go('s2')">${i<n?'✅':(i>n?'🔒':x.ik)} ${i+1}. ${x.t}</button>`).join('');
  app.innerHTML=topbar()+`<div class="layout"><div class="side">${side}</div>
  <div class="card mat"><div class="no" style="font-family:var(--font-head);color:var(--ink2);letter-spacing:.08em">POS ${p+1} DARI ${MATERI.length}</div><h2>${m.ik} ${m.t}</h2>${m.h}<div id="sentinel" style="height:2px"></div>
   <div class="readbar"><div class="msg" id="rmsg"></div><div class="row"><button class="btn ghost small" onclick="go('map')">🗺️ Peta</button><button class="btn" id="rbtn" onclick="finishPos()"></button></div></div></div></div>`;
  const st={bottom:false,t:isDone?0:CONFIG.MIN_BACA_DETIK};
  const upd=()=>{
    const ok=isDone||(st.bottom&&st.t<=0);const b=$('#rbtn'),mm=$('#rmsg');if(!b)return;
    b.disabled=!ok;
    b.textContent=(p===MATERI.length-1&&!S.done[1])?'Selesaikan Tahap 2 🎉':(isDone?(p<MATERI.length-1?'Pos berikutnya →':'Selesai ✓'):'Pos berikutnya →');
    mm.textContent=ok?'✅ Siap lanjut.':(!st.bottom?'📖 Baca sampai akhir halaman':'')+(st.t>0?`${!st.bottom?' · ':''}⏳ tunggu ${st.t} dtk`:'');
  };
  upd();
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){st.bottom=true;upd()}},{threshold:0});io.observe($('#sentinel'));
  timers.push(setInterval(()=>{if(st.t>0){st.t--;upd()}},1000));
}
function finishPos(){
  const p=ctx.pos,n=S.materi.n;
  if(p===n){S.materi.n=n+1;save()}
  if(S.materi.n>=MATERI.length&&!S.done[1]){S.done[1]=true;save();send('tahap2');confetti();modal('Pasraman Tuntas! 📜','<p>Kamu telah melewati semua pos materi. Gerbang <b>Jalan Dharma</b> kini terbuka.</p>',[{t:'Ke peta 🗺️',fn:()=>go('map')}]);return}
  if(p<MATERI.length-1){ctx.pos=p+1;go('s2')}else go('map');
}

   <div class="scn"><span class="tag">${c.tag}</span><p style="margin:0;line-height:1.6">${c.s}</p></div>${opts}${fb}

}

function optHTML(id,q,handler,reveal){
  const s=SOAL[id],ord=q.opt[id],sel=q.ans[id]||[];
  return ord.map((L,i)=>{
    let cls='';
    if(reveal){if(s.kunci.includes(L))cls='right';else if(sel.includes(L))cls='wrong'}
    else if(sel.includes(L))cls='sel';
    return `<button class="opt ${cls}" ${reveal?'disabled':''} onclick="${handler}('${L}')"><span class="ltr">${LET[i]}</span><span>${esc(s.opsi[L])}</span></button>`}).join('');
}
function toggle(q,id,L){
  const s=SOAL[id];let a=q.ans[id]||[];
  if(s.tipe==='pg')a=[L];
  else if(a.includes(L))a=a.filter(x=>x!==L);
  else if(a.length>=2){toast('Pilih tepat DUA jawaban. Batalkan salah satu dulu.');return}
  else a=a.concat(L);
  q.ans[id]=a;save();
}
function correctLetters(id,q){return SOAL[id].kunci.map(L=>LET[q.opt[id].indexOf(L)]).sort().join(' dan ')}

/* ---------- TAHAP 4 ---------- */
function initQ(q,set){q.order=shuf(set);q.opt={};set.forEach(id=>q.opt[id]=shuf(Object.keys(SOAL[id].opsi)));q.i=0;q.ans={}}
function vS4(){
  const q=S.q4;
  if(!q.order.length){initQ(q,SET4);q.locked={};q.deadline=null;save()}
  if(q.selesai){
    const rows=q.order.map((id,i)=>`<i class="${isRight(id,q.ans[id])?'ok':'no'}"></i>`).join('');
    app.innerHTML=topbar()+`<div class="card narrow" style="text-align:center"><h2>💧 Tirta Uji – Selesai</h2><div class="prog" style="margin-top:12px">${rows}</div>
     <div class="bigscore">${q.skor}</div><div class="stars">${q.benar>=9?'⭐⭐⭐':q.benar>=7?'⭐⭐☆':q.benar>=5?'⭐☆☆':'☆☆☆'}</div><p class="sub">${q.benar} dari 10 soal benar.</p>
     <div class="row" style="justify-content:center"><button class="btn ghost" onclick="go('map')">🗺️ Peta</button>${S.done[4]?'':`<button class="btn" onclick="go('s5')">Gerbang Puncak Moksa 🏔️</button>`}</div></div>`;
    return;
  }
  const id=q.order[q.i],locked=!!q.locked[id];
  if(!locked&&!q.deadline){q.deadline=Date.now()+CONFIG.DETIK_PER_SOAL*1000;save()}
  const prog=q.order.map((x,i)=>`<i class="${q.locked[x]?(isRight(x,q.ans[x])?'ok':'no'):i===q.i?'on':''}"></i>`).join('');
  const ring=`<div class="ring"><svg width="64" height="64"><circle cx="32" cy="32" r="26" stroke="#e7dcc0" stroke-width="7" fill="none"/><circle id="rc" cx="32" cy="32" r="26" stroke="#ef7b2c" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="0"/></svg><div class="t" id="rt">2:00</div></div>`;
  let fb='';
  if(locked){
    const ok=isRight(id,q.ans[id]),none=!(q.ans[id]||[]).length;
    fb=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ Benar! ':none?'⏰ Waktu habis. ':'❌ Belum tepat. '}${ok?'':`Jawaban benar: <b>${correctLetters(id,q)}</b>. `}${PEMBAHASAN[id]||''}</div>`;
  }
  app.innerHTML=topbar()+`<div class="card"><div class="qhead"><div class="qno">💧 Soal ${q.i+1} / ${q.order.length}</div>${locked?'':ring}</div>
   <div class="prog">${prog}</div>
   ${soalHTML(id,q,optHTML(id,q,'pick4',locked))}${fb}
   <div class="row end" style="margin-top:14px">${locked?`<button class="btn" onclick="next4()">${q.i===q.order.length-1?'Lihat Hasil 🏁':'Soal berikutnya →'}</button>`:`<button class="btn" id="k4" ${(q.ans[id]||[]).length?'':'disabled'} onclick="lock4(false)">Kunci Jawaban 🔒</button>`}</div></div>`;
  if(!locked){
    const tick=()=>{
      const rem=Math.max(0,q.deadline-Date.now()),sec=Math.ceil(rem/1000);
      const rt=$('#rt'),rc=$('#rc');if(!rt)return;
      rt.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
      rc.setAttribute('stroke-dashoffset',String(163.4*(1-rem/(CONFIG.DETIK_PER_SOAL*1000))));
      rc.setAttribute('stroke',sec<=20?'#c23b3b':'#ef7b2c');
      if(rem<=0){clearTimers();lock4(true)}
    };tick();timers.push(setInterval(tick,250));
  }
}
function pick4(L){const q=S.q4,id=q.order[q.i];if(q.locked[id])return;toggle(q,id,L);vS4Soft()}
function vS4Soft(){render()}
function lock4(timeout){
  const q=S.q4,id=q.order[q.i];if(q.locked[id])return;
  const sel=q.ans[id]||[];if(!timeout&&SOAL[id].tipe==='pgk'&&sel.length<2){toast('Pilih DUA jawaban.');return}
  q.locked[id]=true;q.deadline=null;save();render();
  if(timeout)toast('⏰ Waktu 2 menit habis!');
}
function next4(){
  const q=S.q4;
  if(q.i<q.order.length-1){q.i++;q.deadline=null;save();go('s4');return}
  q.benar=countRight(q,q.order);q.skor=q.benar*10;q.selesai=true;S.done[3]=true;save();send('tahap4');confetti();go('s4');
}

/* ---------- TAHAP 5 ---------- */
function vS5(){
  const q=S.q5;
  if(!q.order.length){initQ(q,SET5);save()}
  if(q.selesai){go('hasil');return}
  const id=q.order[q.i];
  const nav=q.order.map((x,i)=>`<button class="${(q.ans[x]||[]).length?'ans':''} ${i===q.i?'cur':''}" onclick="S.q5.i=${i};save();render()">${i+1}</button>`).join('');
  const last=q.i===q.order.length-1;
  app.innerHTML=topbar()+`<div class="card"><div class="qhead"><div class="qno">🏔️ Soal ${q.i+1} / ${q.order.length}</div><span class="chip" style="background:var(--parch2);color:var(--ink);border-color:var(--line)">Dijawab: <b style="color:var(--saffron)">${q.order.filter(x=>(q.ans[x]||[]).length).length}</b>/${q.order.length}</span></div>
   <div class="nav">${nav}</div>
   ${soalHTML(id,q,optHTML(id,q,'pick5',false))}
   <div class="row between" style="margin-top:14px"><button class="btn ghost" ${q.i===0?'disabled':''} onclick="S.q5.i--;save();render();window.scrollTo({top:0})">← Sebelumnya</button>
   ${last?`<button class="btn green" onclick="submit5()">Kumpulkan Jawaban ✔</button>`:`<button class="btn" onclick="S.q5.i++;save();render();window.scrollTo({top:0})">Berikutnya →</button>`}</div></div>`;
}
function pick5(L){const q=S.q5,id=q.order[q.i];toggle(q,id,L);render()}
function submit5(){
  const q=S.q5,un=q.order.filter(x=>!(q.ans[x]||[]).length).length;
  const bad=q.order.filter(x=>SOAL[x].tipe==='pgk'&&(q.ans[x]||[]).length===1).length;
  modal('Kumpulkan jawaban?',un||bad?`<p>${un?`Masih ada <b>${un}</b> soal belum dijawab. `:''}${bad?`Ada <b>${bad}</b> soal pilihan ganda kompleks yang baru memilih satu jawaban. `:''}Kamu tidak dapat mengulang setelah dikumpulkan.</p>`:`<p>Semua soal sudah terjawab. Kamu tidak dapat mengulang setelah dikumpulkan.</p>`,
   [{t:'Periksa lagi',cls:'ghost'},{t:'Ya, kumpulkan',fn:finish5}]);
}
function finish5(){
  const q=S.q5;q.benar=countRight(q,q.order);q.skor=Math.round(q.benar/q.order.length*1000)/10;q.selesai=true;S.done[4]=true;S.selesai=new Date().toISOString();save();
  send('selesai');confetti();go('hasil');
}

/* ---------- HASIL ---------- */
function vHasil(){
  const q4=S.q4,q5=S.q5,na=nilaiAkhir(),pr=predikat(na),tuntas=na>=CONFIG.KKM;
  const rev=q5.order.map((id,i)=>{
    const ok=isRight(id,q5.ans[id]);
    return `<details><summary>${ok?'✅':'❌'} Soal ${i+1}</summary>
     <div style="margin-top:10px">${soalHTML(id,q5,optHTML(id,q5,'noop',true))}<div class="fb ${ok?'ok':'no'}">Jawaban benar: <b>${correctLetters(id,q5)}</b>. ${PEMBAHASAN[id]||''}</div></div></details>`}).join('');
  app.innerHTML=topbar()+`<div class="card" style="text-align:center"><div class="om" style="color:var(--saffron);letter-spacing:.1em">ॐ PUNCAK MOKSA TERCAPAI ॐ</div>
   <h2>Selamat, ${esc(S.nama.split(' ')[0])}!</h2><div class="bigscore">${fmt(na)}</div><div class="stars">${na>=90?'⭐⭐⭐':na>=CONFIG.KKM?'⭐⭐☆':'⭐☆☆'}</div>
   <p class="sub"><b>${pr}</b> · ${tuntas?'Kamu telah tuntas (KKM '+CONFIG.KKM+').':'Belum mencapai KKM '+CONFIG.KKM+'. Pelajari lagi pembahasan di bawah dan konsultasikan dengan gurumu.'}</p>
   <div class="grid2"><div class="stat"><b>${q4.skor}</b><span>Uji Pemahaman (${q4.benar}/10)</span></div><div class="stat"><b>${fmt(q5.skor)}</b><span>Asesmen Formatif (${q5.benar}/15)</span></div><div class="stat"><b>${xp()}</b><span>Dharma Point</span></div><div class="stat"><b>${fmt(durasi())}</b><span>Menit petualangan</span></div></div>
   <div id="sync">${syncHTML()}</div>
   <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" onclick="window.print()">🖨️ Cetak / Simpan Sertifikat (PDF)</button><button class="btn ghost" onclick="backup()">⬇️ Unduh cadangan hasil</button><button class="btn ghost" onclick="go('map')">🗺️ Peta</button></div></div>
   <div class="card" style="margin-top:16px;text-align:left"><h2>📖 Pembahasan Asesmen Formatif</h2><p class="sub">Ketuk tiap soal untuk melihat jawaban benar dan penjelasan.</p>${rev}</div>
   <div class="cert"><div style="color:#b8861f;letter-spacing:.2em">ॐ SWASTYASTU ॐ</div><h2>SERTIFIKAT PETUALANGAN ATMAN</h2><p>Diberikan kepada</p><div class="nm">${esc(S.nama)}</div>
   <p>Kelas ${esc(S.kelas)} · No. Absen ${esc(S.absen)}<br>SMA Negeri 1 Selat</p>
   <p>telah menyelesaikan seluruh tahap pembelajaran interaktif<br><b>Pendidikan Agama Hindu dan Budi Pekerti Kelas XII</b><br>(Upanisad, Moksa, Catur Marga, dan Kepemimpinan Hindu)</p>
   <p style="font-size:1.4rem">Nilai akhir: <b>${fmt(na)}</b> — ${pr}</p><p style="font-size:.85rem">${new Date(S.selesai||Date.now()).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</p></div>`;
  flush().then(updateSync);
}
function noop(){}
function backup(){
  const p=payload('cadangan'),keys=Object.keys(p);
  const csv=keys.join(',')+'\n'+keys.map(k=>'"'+String(p[k]).replace(/"/g,'""')+'"').join(',');
  const b=new Blob(['﻿'+csv],{type:'text/csv'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='hasil_'+S.kelas+'_'+String(S.absen).padStart(2,'0')+'.csv';a.click();
}

/* ---------- guru ---------- */
function guru(){
  const pin=prompt('Masukkan PIN guru untuk mereset data di perangkat ini:');
  if(pin===null)return;
  if(pin!==CONFIG.PIN_GURU){toast('PIN salah.');return}
  if(confirm('Hapus seluruh progres siswa di perangkat ini?')){lsDel(CONFIG.KUNCI_STORAGE);lsDel(CONFIG.KUNCI_STORAGE+'_q');S=null;ctx={};go('splash')}
}

/* kejujuran: hitung perpindahan tab saat tahap 4/5 */
document.addEventListener('visibilitychange',()=>{
  if(!S||!document.hidden)return;
  if(view==='s4'&&!S.q4.selesai){S.q4.tab=(S.q4.tab||0)+1;save()}
  if(view==='s5'&&!S.q5.selesai){S.q5.tab=(S.q5.tab||0)+1;save()}
});

/* mulai */
load();
if(S&&S.done[0])view='splash';
render();
flush();
</script>
</body>
</html>
